name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.31.2
  AGENTICA_SHA256: 8bb00ce8ae0dd23cfb3557a8b24f39688a6569168c8b7fd96f590e2ea9d2b1df

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: agentica --version

      - run: make verify-vendor

      - name: Check the format
        run: agentica fmt --check tui.agc src examples tests

      # Checks every .agc file, runs the unit tests and the pseudo-terminal tests, on the committed libtermbox2.so.
      - run: make test

  # The committed native/linux/libtermbox2.so must be the build of native/ on the oldest supported glibc. The fresh
  # build is uploaded, so a change of native/ commits this artifact.
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - run: make native-verify FRESH="$RUNNER_TEMP/native/libtermbox2.so"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: libtermbox2-linux-x86_64
          path: ${{ runner.temp }}/native/libtermbox2.so
          if-no-files-found: error
