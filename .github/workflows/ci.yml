name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.39.1

jobs:
  test:
    name: test (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux-x86_64
            runner: ubuntu-latest
            archive: agentica-0.39.1-linux-x86_64.tar.gz
            sha256: c2ce2354068b82858917f049a38d3831f64a71d495b5237785aaf622d6d52725
          - system: macos-arm64
            runner: macos-latest
            archive: agentica-0.39.1-macos-arm64.tar.gz
            sha256: a61cbe832373284c2ce91b5645388c7f8a7754df4d28515efc8762581fa29994
          - system: macos-x86_64
            runner: macos-15-intel
            archive: agentica-0.39.1-macos-x86_64.tar.gz
            sha256: 14d83a7269fb8498526065efba07561f30ece4f79768fdece8360cdd62dc1951
          - system: windows-x86_64
            runner: windows-2025
            archive: agentica-0.39.1-windows-x86_64.zip
            sha256: 32a76c86ef9f1e51114e18b6eb91d83b7502d539c64f7ef8ceb11e0d3d507fd2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Agentica release
        if: runner.os != 'Windows'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/${{ matrix.archive }}" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/${{ matrix.archive }}" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/${{ matrix.archive }}" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-${{ matrix.system }}/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Agentica release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "${{ matrix.archive }}"
          Invoke-WebRequest -Uri "https://github.com/agentica-lang/agentica/releases/download/$env:AGENTICA_VERSION/${{ matrix.archive }}" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "${{ matrix.sha256 }}".ToUpper()) { throw "bad sha256" }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "agentica-$env:AGENTICA_VERSION-${{ matrix.system }}\bin")

      - run: agentica --version
        shell: bash

      - name: Check the format
        shell: bash
        run: agentica fmt --check tui.agc src examples tests

      # Linux and macOS: checks every .agc file, runs the unit tests and the pseudo-terminal tests.
      - name: Test
        if: runner.os != 'Windows'
        run: make test

      # Windows has no pseudo-terminal in the test suite: it checks and runs the unit tests.
      - name: Check and unit tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for file in tui.agc src/*.agc examples/*.agc tests/*.agc tests/fixtures/*.agc; do
            agentica check "$file" || exit 1
          done
          agentica test tests
